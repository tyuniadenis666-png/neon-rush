name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NEON_RUSH.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-RUSH-Android-APK
          path: build/NEON_RUSH.apk
          if-no-files-found: error
          retention-days: 14
